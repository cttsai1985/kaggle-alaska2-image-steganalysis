name: CPU contracts

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      UV_LINK_MODE: hardlink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.10.4
      - name: Install locked environment
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check src tests tools
      - name: Check formatting
        run: uv run --locked ruff format --check src tests tools
      - name: CPU regression tests
        run: uv run --locked pytest -q -m "not cuda"
