# Phase-2 real-data baseline (phase-1 resource plan, docs/phase1-readiness.md section 7).
# Single holdout = legacy fold 1 (family-level). Not cross-validation.
schema_version = 1
purpose = "baseline"
name = "baseline_effb0_fold1"

[data]
root = "~/data/kaggle/alaska2-image-steganalysis"
images_dir = "raw/extracted"
manifest = "manifest/files_manifest.parquet"
folds = "manifest/legacy_family_folds.parquet"
runs_dir = "runs"
expected_manifest_sha256 = "ab90caf00e5b21bde712cbb0fccd9aa5a6a1d41dff743934f186ae0806f5c274"
expected_folds_sha256 = "7260e8bdb592cdd970d4cddace4321e68e8e1c81a085ab1ac7b223ca627b8d02"
image_size = 512          # all 305,000 files are 512x512 RGB (phase-1 manifest): no resize
decoder = "opencv"        # phase-1 decode probe: 491 img/s (OpenCV) vs 192 (Pillow), 1 process
classes = ["Cover", "JMiPOD", "JUNIWARD", "UERD"]

[split]
holdout_fold = 1
max_fit_families = 0      # 0 = all; > 0 = explicit, labeled family subset
max_valid_families = 0

[model]
backbone = "efficientnet_b0"
pretrained = true
weights_repo = "timm/efficientnet_b0.ra_in1k"
weights_file = "model.safetensors"
weights_revision = "1b5383e5f79cc0f7fc067e372f8f26a5fa73f26a"
weights_sha256 = "d569899762ea9b1384ee07f4af64805cf8caa1c55f9253ebb1080dc40e87a2cd"
drop_rate = 0.2             # legacy EfficientNet-PyTorch b0 default dropout before the classifier

[transforms]
# Legacy recipe (legacy/configs/train_efficient_net_b2_finetune.py) minus the no-op Resize(512):
# pixel-position permutations only; validation is untransformed.
train = [
  { op = "hflip", p = 0.5 },
  { op = "vflip", p = 0.5 },
  { op = "rot90", p = 0.5 },
]
valid = []
normalize_mean = [0.485, 0.456, 0.406]   # albumentations Normalize defaults = timm ra_in1k config
normalize_std = [0.229, 0.224, 0.225]
max_pixel_value = 255.0

[train]
device = "cuda"
seed = 20261109
epochs = 6                # cap from the plan; phase 2B fixes E = min(6, floor((10800 - 900) / epoch_s)) from the smoke
batch_size = 32
num_workers = 12          # operator cap 16
pin_memory = true
persistent_workers = true
prefetch_factor = 4
amp_dtype = "bf16"
channels_last = true
cudnn_benchmark = false
lr = 5e-4
weight_decay = 1e-2
warmup_steps = 500
label_smoothing = 0.05    # legacy LabelSmoothing(smoothing=.05); same formula as torch CrossEntropyLoss
max_steps_per_epoch = 0   # 0 = full epoch
log_every = 50
evaluate_at_end = true
fault_inject_after_epoch = 0

[eval]
batch_size = 64
amp_dtype = "bf16"

[verify]
prob_atol = 1e-3          # max |p_rebuilt - p_saved| over all rows and classes
metric_atol = 1e-4        # |weighted AUC rebuilt - saved|
