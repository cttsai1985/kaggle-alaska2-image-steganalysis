[project]
name = "alaska2"
version = "0.1.0"
description = "ALASKA2 steganalysis: reproducible ML engineering case study (modern package)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "polars>=1.20",
    "pyarrow>=18.0",
    "scikit-learn>=1.6",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "timm>=1.0.20,<1.1",
    "huggingface-hub>=0.30",
    "safetensors>=0.4",
]

[project.scripts]
alaska2 = "alaska2.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]
# kept (empty) so the phase-1 `uv run --group probe` command still works; opencv is now a main dependency
probe = []
# CPU-only plots for the phase-2 holdout analysis (saved predictions only)
analysis = ["matplotlib>=3.9"]
lab = ["jupyterlab>=4.3,<5", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "nbconvert>=7.16,<8", "ipykernel>=6.29,<8"]
release = ["build>=1.2,<2", "hatchling>=1.25,<2"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alaska2"]

[tool.uv]
package = true

# CUDA 12.6 wheels (driver 595.71 / CUDA 13.2 driver API is backward compatible with cu12x runtimes).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["alaska2", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "cuda: needs a CUDA GPU (deselect with -m 'not cuda')",
    "slow: CPU end-to-end tests (seconds, not minutes)",
]
