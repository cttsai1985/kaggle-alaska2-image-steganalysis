[project]
name = "alaska2"
version = "0.0.1"
description = "ALASKA2 steganalysis: reproducible ML engineering case study (readiness tooling)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pillow>=11.0",
    "polars>=1.20",
    "pyarrow>=18.0",
    "scikit-learn>=1.6",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]
probe = ["opencv-python-headless>=4.10"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["script", "alaska_utils", "configs", "docker"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
